<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f8"/>
    </linearGradient>
    <marker id="arw" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="960" height="78" fill="url(#hdr)"/>
  <text x="34" y="34" fill="#ffffff" font-size="21" font-weight="bold">NLP 测度构建五步：从原始文本到可用变量</text>
  <text x="34" y="60" fill="#ffe9e3" font-size="13">企业数字化转型的文本测度构建及其对创新绩效的影响 · 毕业论文模拟稿</text>

  <!-- 步骤卡片 -->
  <g>
    <!-- step 1 -->
    <rect x="34" y="106" width="168" height="150" rx="12" fill="url(#st)" stroke="#c0392b" stroke-width="2"/>
    <circle cx="60" cy="132" r="15" fill="#c0392b"/>
    <text x="60" y="137" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    <text x="84" y="137" fill="#2c3e50" font-size="15" font-weight="bold">语料获取</text>
    <text x="50" y="163" fill="#7f8c8d" font-size="11">Corpus Acquisition</text>
    <text x="50" y="188" fill="#34495e" font-size="11.5">输入：研究问题+数据可得性</text>
    <text x="50" y="208" fill="#34495e" font-size="11.5">输出：结构化语料库</text>
    <text x="50" y="232" fill="#c0392b" font-size="11.5" font-weight="bold">关键动作：定源·对齐·留痕</text>

    <!-- step 2 -->
    <rect x="222" y="106" width="168" height="150" rx="12" fill="url(#st)" stroke="#d35400" stroke-width="2"/>
    <circle cx="248" cy="132" r="15" fill="#d35400"/>
    <text x="248" y="137" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    <text x="272" y="137" fill="#2c3e50" font-size="15" font-weight="bold">文本预处理</text>
    <text x="238" y="163" fill="#7f8c8d" font-size="11">Preprocessing</text>
    <text x="238" y="188" fill="#34495e" font-size="11.5">解析→清洗→分词</text>
    <text x="238" y="208" fill="#34495e" font-size="11.5">去停用词·词形归一</text>
    <text x="238" y="232" fill="#d35400" font-size="11.5" font-weight="bold">关键动作：去噪·分词·归一</text>

    <!-- step 3 -->
    <rect x="410" y="106" width="168" height="150" rx="12" fill="url(#st)" stroke="#b7950b" stroke-width="2"/>
    <circle cx="436" cy="132" r="15" fill="#b7950b"/>
    <text x="436" y="137" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    <text x="460" y="137" fill="#2c3e50" font-size="15" font-weight="bold">特征提取</text>
    <text x="426" y="163" fill="#7f8c8d" font-size="11">Feature Extraction</text>
    <text x="426" y="188" fill="#34495e" font-size="11.5">词典法 / 词嵌入 / 主题模型</text>
    <text x="426" y="208" fill="#34495e" font-size="11.5">输出：文本的数值表示</text>
    <text x="426" y="232" fill="#b7950b" font-size="11.5" font-weight="bold">关键动作：选路线·定维度</text>

    <!-- step 4 -->
    <rect x="598" y="106" width="168" height="150" rx="12" fill="url(#st)" stroke="#1e8449" stroke-width="2"/>
    <circle cx="624" cy="132" r="15" fill="#1e8449"/>
    <text x="624" y="137" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    <text x="648" y="137" fill="#2c3e50" font-size="15" font-weight="bold">指标构建</text>
    <text x="614" y="163" fill="#7f8c8d" font-size="11">Measure Construction</text>
    <text x="614" y="188" fill="#34495e" font-size="11.5">加权·聚合·标准化</text>
    <text x="614" y="208" fill="#34495e" font-size="11.5">输出：企业-年份面板</text>
    <text x="614" y="232" fill="#1e8449" font-size="11.5" font-weight="bold">关键动作：加权·聚合·命名</text>

    <!-- step 5 -->
    <rect x="786" y="106" width="140" height="150" rx="12" fill="url(#st)" stroke="#2471a3" stroke-width="2"/>
    <circle cx="812" cy="132" r="15" fill="#2471a3"/>
    <text x="812" y="137" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">5</text>
    <text x="836" y="137" fill="#2c3e50" font-size="15" font-weight="bold">信效度</text>
    <text x="802" y="163" fill="#7f8c8d" font-size="10.5">Reliability &amp; Validity</text>
    <text x="802" y="188" fill="#34495e" font-size="11">内容/聚合/区分/预测</text>
    <text x="802" y="208" fill="#34495e" font-size="11">不通过→回到第 3 步</text>
    <text x="802" y="232" fill="#2471a3" font-size="11" font-weight="bold">四类效度+回归</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#7f8c8d" stroke-width="2" marker-end="url(#arw)">
    <line x1="202" y1="181" x2="220" y2="181"/>
    <line x1="390" y1="181" x2="408" y2="181"/>
    <line x1="578" y1="181" x2="596" y2="181"/>
    <line x1="766" y1="181" x2="784" y2="181"/>
  </g>

  <!-- 反馈回路 -->
  <path d="M 856 256 L 856 300 L 494 300 L 494 258" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="600" y="293" fill="#7f8c8d" font-size="11.5">信效度未通过 → 更换技术路线 / 修订词典</text>

  <!-- 底部：概念翻译链 -->
  <rect x="34" y="330" width="892" height="196" rx="12" fill="#fbfcfd" stroke="#dfe6ec" stroke-width="1.5"/>
  <text x="54" y="358" fill="#2c3e50" font-size="14" font-weight="bold">概念翻译链：Concept → Construct → Indicator → Measure → Variable</text>

  <g font-size="11.5">
    <rect x="54" y="376" width="160" height="62" rx="9" fill="#fdecea" stroke="#c0392b"/>
    <text x="70" y="398" fill="#c0392b" font-weight="bold">Concept 概念</text>
    <text x="70" y="419" fill="#34495e">企业数字化转型</text>

    <rect x="228" y="376" width="160" height="62" rx="9" fill="#fef5e7" stroke="#d35400"/>
    <text x="244" y="398" fill="#d35400" font-weight="bold">Construct 构念</text>
    <text x="244" y="419" fill="#34495e">运用数字技术的程度</text>

    <rect x="402" y="376" width="160" height="62" rx="9" fill="#fef9e7" stroke="#b7950b"/>
    <text x="418" y="398" fill="#b7950b" font-weight="bold">Indicator 指标</text>
    <text x="418" y="419" fill="#34495e">MD&amp;A 数字词词频</text>

    <rect x="576" y="376" width="160" height="62" rx="9" fill="#eafaf1" stroke="#1e8449"/>
    <text x="592" y="398" fill="#1e8449" font-weight="bold">Measure 测度</text>
    <text x="592" y="419" fill="#34495e">命中词数/有效词数</text>

    <rect x="750" y="376" width="158" height="62" rx="9" fill="#eaf2f8" stroke="#2471a3"/>
    <text x="766" y="398" fill="#2471a3" font-weight="bold">Variable 变量</text>
    <text x="766" y="419" fill="#34495e">DT_Ratio（企业-年度）</text>
  </g>
  <g stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arw)">
    <line x1="214" y1="407" x2="226" y2="407"/>
    <line x1="388" y1="407" x2="400" y2="407"/>
    <line x1="562" y1="407" x2="574" y2="407"/>
    <line x1="736" y1="407" x2="748" y2="407"/>
  </g>
  <text x="54" y="470" fill="#7f8c8d" font-size="11.5">关键认知：所有测度都是代理变量（proxy）——信度问"测得稳不稳"，效度问"测的是不是它"。</text>
  <text x="54" y="494" fill="#7f8c8d" font-size="11.5">三角互证：财务数据 × 文本测度 × 行为数据，三者方向一致时测度可信度显著提升。</text>
  <text x="54" y="518" fill="#95a5a6" font-size="10.5">数据说明：本项目语料为模拟生成（详见 README 第二节），方法链路真实可复现，结论仅用于教学演示。</text>
</svg>
